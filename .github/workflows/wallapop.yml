name: wallapop

on:
  schedule:
    - cron: "*/5 * * * *"   # relevo: si no hay ejecución en marcha, arranca otra
  workflow_dispatch:

concurrency:
  group: wallapop
  cancel-in-progress: false  # una en marcha + otra en cola, nunca dos a la vez

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Comprobar Wallapop (bucle)
        run: python -u check.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: "19800"   # 5 h 30 min por ejecución
          CHECK_INTERVAL: "10"    # segundos entre comprobaciones

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "wallapop-bot"
          git config user.email "wallapop-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "estado [skip ci]"
            git pull --rebase -X theirs
            git push
          fi
